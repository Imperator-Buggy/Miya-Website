<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve secrets, source helpers, or the SQLite file.
    <DirectoryMatch "^/var/www/html/(src|data|docker|tools|design)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.(env|git)">
        Require all denied
    </FilesMatch>

    # Service worker must be allowed to control the whole origin.
    <Files "sw.js">
        Header set Service-Worker-Allowed "/"
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
